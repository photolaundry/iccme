[project]
name = "iccme"
version = "0.3.1"
description = "batch apply ICC profiles to images"
authors = [
  { name = "Bobo Li", email = "bobo@photolaundrysf.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "wand>=0.6.13"
]

[project.scripts]
iccme = "iccme:cli"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
